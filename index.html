<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Answerer</title>
  <link rel="manifest" href="app.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="modulepreload" href="vendor/anthropic-sdk.mjs" />
</head>
<body>
  <main id="app">
    <video id="video" autoplay playsinline muted></video>
    <img id="frozen" alt="" hidden />

    <div id="guide" aria-hidden="true">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <p id="hint">Fit the question inside the frame, then tap</p>

    <div id="camera-error" hidden>
      <p id="camera-error-text">Camera unavailable.</p>
      <button id="retry-camera" type="button">Enable camera</button>
    </div>

    <section id="sheet" hidden aria-live="polite">
      <div class="sheet-head">
        <span id="status">Reading…</span>
        <span id="timing"></span>
      </div>
      <div id="answer"></div>
    </section>

    <div id="controls">
      <label id="upload" class="side-btn" title="Choose a photo">
        <input id="file" type="file" accept="image/*" capture="environment" />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h3l2-2h6l2 2h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm8 3.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="sr">Upload photo</span>
      </label>
      <button id="shutter" type="button" aria-label="Capture and answer"><span></span></button>
      <button id="torch" class="side-btn" type="button" title="Flashlight" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-11h-6l1-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="sr">Flashlight</span>
      </button>
    </div>

    <button id="open-settings" type="button" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="sr">Settings</span>
    </button>

    <form id="settings" hidden autocomplete="off">
      <h1>Settings</h1>
      <label for="api-key">Anthropic API key</label>
      <input id="api-key" type="password" autocapitalize="off" spellcheck="false" placeholder="sk-ant-..." required />
      <p class="note">Saved only on this phone, and sent only to Anthropic. Get one at console.anthropic.com.</p>

      <label for="effort">Thinking</label>
      <select id="effort">
        <option value="low">Low: fastest (recommended)</option>
        <option value="medium">Medium: better at hard math</option>
        <option value="high">High: slowest, most careful</option>
      </select>

      <label class="check"><input id="fast" type="checkbox" /> Fast mode: answers write out up to ~2.5× faster, at 2× the price</label>

      <p id="settings-error" role="alert"></p>
      <div class="row">
        <button id="cancel" type="button" class="secondary">Cancel</button>
        <button id="save" type="submit">Save</button>
      </div>
    </form>

    <canvas id="canvas" hidden></canvas>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
